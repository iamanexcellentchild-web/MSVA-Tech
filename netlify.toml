# Netlify only forwards traffic to the Django app on Render; it doesn't build anything.
# Forwards everything to the Django app on Render.
[build]
  publish = "netlify"
  command = "echo 'Proxy only: Django runs on Render'"

# Send visitors on the netlify.app address to the real domain, so cookies and forms
# (sign in/out, applications) always run on one trusted address.
[[redirects]]
  from = "https://msvirtualacad.netlify.app/*"
  to = "https://msvirtualacademy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://msva-7tk9.onrender.com/:splat"
  status = 200
  force = true
