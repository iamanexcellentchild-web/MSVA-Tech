<div class="form-field{% if field.errors %} has-error{% endif %}{% if wide %} form-field--wide{% endif %}">
    {% if field.field.widget.input_type == "checkbox" %}
        <label class="checkbox-label">{{ field }} <span>{{ field.label }}</span></label>
    {% else %}
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}<small class="help-text">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
</div>
