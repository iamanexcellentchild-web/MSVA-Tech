# Render Blueprint: Django app (free plan). The database is Neon, not Render.
services:
  - type: web
    name: msva
    runtime: python
    plan: free
    region: frankfurt  # closest Render region to Nigeria; keep Neon in AWS Frankfurt too
    buildCommand: ./build.sh
    startCommand: gunicorn msva.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Fill these in on the Render dashboard (they are secrets or depend on your URLs).
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Google sign-in is optional: add GOOGLE_OAUTH_CLIENT_ID / _SECRET / _REDIRECT_URI later to show the button.
